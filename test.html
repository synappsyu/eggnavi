  .box { box-sizing: border-box; width: calc(100% - 32px); max-width: 360px; margin: 16vh auto 0; padding: 28px 22px 24px; background: #fff; border: 1px solid #eee5d3; border-radius: 24px; box-shadow: 0 10px 30px #0000000d; }
