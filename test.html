  var put = function (v) { try { if (v) localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) {} };
  function openTool(html) {
    // ページを読み終えてから開く(読んでいる途中に開くと、包みの画面の上に書き足されてしまう)
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') setTimeout(go, 0); else window.addEventListener('load', function () { setTimeout(go, 0); });
  }
  function decrypt(key, data) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12)); }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  // 本体を元に戻して開く
  function tryOpen(key, remember) {
    return decrypt(key, bytes(CT)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      if (remember) crypto.subtle.exportKey('raw', key).then(function (raw) { var s = ''; new Uint8Array(raw).forEach(function (c) { s += String.fromCharCode(c); }); put(btoa(s)); openTool(html); });
      else openTool(html);
    });
  }
  function ask(message) {
    $('msg').textContent = message || '';
    $('go').onclick = function () {
      var pw = $('pw').value; if (!pw) return;
      $('go').disabled = true; $('msg').textContent = '';
      derive(pw).then(function (key) { return tryOpen(key, true); }).catch(function () { $('go').disabled = false; $('msg').textContent = '合言葉が違います。'; });
    };
    $('pw').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  }
  if (!window.crypto || !crypto.subtle) { ask('このブラウザでは開けません。'); $('go').disabled = true; return; }
  // 新しい版が出ていないかを確かめてから開く。ブラウザは公開ページを前の版のまま覚えていることがある(GitHub Pages は10分まで覚えてよいと伝える。
  // 2026-10-26 本人「Safari が全然新しい版に更新されない」)。覚えている版を使わずにページの先頭だけを取りに行き、版の印が違えば、
  // アドレスに版の印を付けて開き直す(アドレスが変わると、ブラウザは覚えている版を使わない)。電波がないときや3秒で返事がないときは、このまま開く。
  // 同じ版の印で開き直すのは1回だけ(公開ページの側がまだ古いときに、開き直しを繰り返さないため)
  var start = function () {
    var saved = get();
    if (!saved) { ask(''); return; }
    crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', true, ['decrypt']).then(function (key) { return tryOpen(key, false); })
      .catch(function () { put(null); ask('合言葉が変わりました。新しい合言葉を入れてください。'); });
  };
  var done = false, once = function () { if (!done) { done = true; start(); } };
  setTimeout(once, 3000);
  try {
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-299' } })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /<!--build:([0-9a-f]+)-->/.exec(t), tried = null;
        try { tried = sessionStorage.getItem(STORE + '_reload'); } catch (e) {}
        if (!done && m && m[1] !== BUILD && tried !== m[1]) {
          done = true;
          try { sessionStorage.setItem(STORE + '_reload', m[1]); } catch (e) {}
          location.replace(location.pathname + '?v=' + m[1]);
          return;
        }
        once();
      })
      .catch(once);
  } catch (e) { once(); }
})();</script>
