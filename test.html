  .box { box-sizing: border-box; width: calc(100% - 32px); max-width: 360px; margin: 16vh auto 0; padding: 28px 22px 24px; background: #fff; border: 1px solid #eee5d3; border-radius: 24px; box-shadow: 0 10px 30px #0000000d; }

  p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid #eee5d3; background: #fffdf9; color: #2d2a26; }

  button:disabled { opacity: .6; }
  .msg { min-height: 1.6em; color: #e5484d; font-size: 14px; margin-top: 10px; }
