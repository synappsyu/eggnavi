  .box { box-sizing: border-box; width: calc(100% - 32px); max-width: 360px; margin: 16vh auto 0; padding: 28px 22px 24px; background: #fff; border: 1px solid #eee5d3; border-radius: 24px; box-shadow: 0 10px 30px #0000000d; }

  p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid #eee5d3; background: #fffdf9; color: #2d2a26; }
  button { margin-top: 12px; width: 100%; font-family: inherit; font-size: 16px; padding: 12px; border-radius: 14px; border: 0; background: #ffc83d; color: #3b2a00; font-weight: 800; box-shadow: 0 3px 10px #f5a40033; }
  button:disabled { opacity: .6; }
  .msg { min-height: 1.6em; color: #e5484d; font-size: 14px; margin-top: 10px; }

    return decrypt(key, bytes(CT)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      if (remember) crypto.subtle.exportKey('raw', key).then(function (raw) { var s = ''; new Uint8Array(raw).forEach(function (c) { s += String.fromCharCode(c); }); put(btoa(s)); openTool(html); });
      else openTool(html);
    });
  }
  function ask(message) {
    $('msg').textContent = message || '';
    $('go').onclick = function () {
      var pw = $('pw').value; if (!pw) return;
      $('go').disabled = true; $('msg').textContent = '';
      derive(pw).then(function (key) { return tryOpen(key, true); }).catch(function () { $('go').disabled = false; $('msg').textContent = '合言葉が違います。'; });
    };
    $('pw').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  }
  if (!window.crypto || !crypto.subtle) { ask('このブラウザでは開けません。'); $('go').disabled = true; return; }
  var saved = get();
  if (!saved) { ask(''); return; }
  crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', true, ['decrypt']).then(function (key) { return tryOpen(key, false); })
    .catch(function () { put(null); ask('合言葉が変わりました。新しい合言葉を入れてください。'); });
})();</script>
