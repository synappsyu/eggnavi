  body { margin: 0; background: #fffaf0; color: #2d2a26; font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  .box { box-sizing: border-box; width: calc(100% - 32px); max-width: 360px; margin: 16vh auto 0; padding: 28px 22px 24px; background: #fff; border: 1px solid #eee5d3; border-radius: 24px; box-shadow: 0 10px 30px #0000000d; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; margin: 0 0 16px; }
  .egg { flex: none; width: 24px; height: 28px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; background: #fff; box-shadow: inset 0 -3px 0 #f1e6cf, 0 1px 3px #0002; position: relative; }
  .egg::after { content: ""; position: absolute; left: 6px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: #ffc83d; }
  p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid #eee5d3; background: #fffdf9; color: #2d2a26; }
  button { margin-top: 12px; width: 100%; font-family: inherit; font-size: 16px; padding: 12px; border-radius: 14px; border: 0; background: #ffc83d; color: #3b2a00; font-weight: 800; box-shadow: 0 3px 10px #f5a40033; }
  button:disabled { opacity: .6; }
  .msg { min-height: 1.6em; color: #e5484d; font-size: 14px; margin-top: 10px; }
</style>
